name: CI

on:
  pull_request:
    branches: [main]

# Least privilege: deterministic jobs run local checks only; no judge secret is read.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.15"

      - run: uv run python scripts/docs_lint.py

      # AGENTS.md section 3 requires this for any change to
      # src/api/static/tokens.css, and both tokens.css and styles.css advertise it
      # as enforced. Until now no workflow ran it. Stdlib-only, ~0s.
      - run: uv run python scripts/check_contrast.py

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The fixture-backed test modules load the fixture themselves when this
    # service is reachable and skip otherwise; the SQL guard gate runs as its own
    # job below so an unreachable database fails loudly there.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: internhunter
          POSTGRES_PASSWORD: internhunter
          POSTGRES_DB: internhunter_eval
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U internhunter -d internhunter_eval"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Dummy values — the standard suite mocks the DB and LLMs; these only
      # satisfy Settings validation at load. NEVER real credentials.
      DATABASE_URL: "postgresql+psycopg://ci:ci@localhost:5432/ci"
      AGENT_DATABASE_URL: "postgresql+psycopg://ci_agent:ci@localhost:5432/ci"
      LANGFUSE_SECRET_KEY: "unused-in-ci"
      LANGFUSE_PUBLIC_KEY: "unused-in-ci"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.15"
          # Cache the uv download/build cache (~/.cache/uv), keyed on uv.lock.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Includes the dev group (mypy/ruff/pytest) — do NOT use --no-dev here.
      - run: uv sync --frozen

      - run: uv run ruff check .

      - run: uv run mypy

      # The SQL generator must never name a column its own prompt does not
      # declare (issue #604). No database, no network, no secrets.
      - run: uv run python scripts/audit_sql_prompt_columns.py

      - run: uv run pytest -q

  migration-check:
    name: Migration chain & ORM sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: internhunter
          POSTGRES_PASSWORD: internhunter
          POSTGRES_DB: internhunter_eval
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U internhunter -d internhunter_eval"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Connect to the real Postgres service for the migration chain.
      ALEMBIC_DATABASE_URL: "postgresql+psycopg://internhunter:internhunter@localhost:5433/internhunter_eval"
      DATABASE_URL: "postgresql+psycopg://internhunter:internhunter@localhost:5433/internhunter_eval"
      AGENT_DATABASE_URL: "postgresql+psycopg://internhunter_agent:internhunter@localhost:5433/internhunter_eval"
      # Throwaway database for the downgrade round-trip test; distinct from the
      # one used by the upgrade / check steps above.
      SCRATCH_DATABASE_URL: "postgresql+psycopg://internhunter:internhunter@localhost:5433/internhunter_scratch"
      # Dummy values — only needed to satisfy Settings validation at load.
      LANGFUSE_SECRET_KEY: "unused-in-ci"
      LANGFUSE_PUBLIC_KEY: "unused-in-ci"
      # required by createdb so the scratch-db step does not prompt interactively
      PGPASSWORD: internhunter
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen

      - name: Create scratch database
        run: createdb -U internhunter -h localhost -p 5433 internhunter_scratch

      # G1: Prove the chain can take a blank database to head.
      - name: Upgrade blank database to head
        run: uv run alembic upgrade head

      # G2: Prove the ORM metadata is not ahead of the revision chain.
      - name: Check ORM metadata matches migration chain
        run: uv run alembic check

      # G3: Prove the downgrade path and re-upgrade both succeed.
      - name: Run migration round-trip tests
        run: uv run pytest tests/migrations -q

  sql-guard-gate:
    name: SQL guard gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The successor to the v0 acceptance gate (ADR-0060). It runs the reviewed
    # SQL statements through the guard and grades the verdict and the reviewed
    # result on the pinned fixture, so it needs the database and nothing else:
    # no serving model, no judge, no secret. It lives in its own job because an
    # unreachable database must fail it loudly, which is different from how the
    # credential-free unit suite treats the same database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: internhunter
          POSTGRES_PASSWORD: internhunter
          POSTGRES_DB: internhunter_eval
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U internhunter -d internhunter_eval"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install
        run: uv sync --frozen

      - name: Load the pinned fixture
        run: uv run python -m evals.fixtures.loader

      # The integration cases in this module need the loaded fixture; the
      # checks job runs the suite without one and skips them.
      - name: Verify the gate's grading and refusals
        run: uv run pytest tests/evals -q

      - name: Gate the reviewed SQL guard cases
        run: uv run python -m evals

