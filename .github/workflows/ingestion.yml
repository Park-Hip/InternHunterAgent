name: Nightly ingestion

# SCHEDULE RE-ARMED 2026-10-05 (#605), reversing the 2026-09-18 removal
# under the frozen-data portfolio release (#405, ADR-0053). The reason that
# removal recorded no longer holds, and the re-arm followed the gate order
# in that issue: prove a manual run green first, arm the trigger second,
# observe one scheduled run third, revert the frozen-data notices last.
#
# Evidence that the path is green, both on `main` and both before this
# trigger existed:
#   run 36299600573  2026-09-27  workflow_dispatch  success
#                    ingestion.completed fetched: 105  pages_failed: 0
#   run 37318661030  2026-10-05  workflow_dispatch  success
#                    ingestion.completed fetched: 110  pages_failed: 0
# Both cleared `safety.min_yield: 20`, both logged `ingestion.schema_ok` with
# `columns: 22`, and both ended in `ingestion.ping_sent`. The robots preflight
# that closed the gate in 2026-08 reads the permitted-absence event
# `ingestion.robots_policy_absent_permitted` (HTTP 404) on every run, which is
# the reviewed `robots.allow_404` case in ADR-0034, not a policy denial.
#
# Merging this to the default branch IS the activation, not a precondition
# for it. PR #29 (`bcc81db`, 2026-07-22) proved that by arming the cron
# before its gates were signed; all 19 runs through 2026-08-09 failed at
# config load with `DATABASE_URL` unset. The rule that survived is unchanged:
# prove a run works by `workflow_dispatch` BEFORE re-arming a schedule, never
# the reverse.
on:
  schedule:
    # 02:00 UTC = 09:00 ICT. GitHub fires `schedule:` from the default branch
    # only. Actual firing time can drift under Actions load; a run landing a
    # few minutes late is expected, not a failure.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

# A green scheduled run every night is not what this design promises, and
# the difference matters when reading the history. The row-quality gate
# fails the whole run closed before any clean upsert or expiry pass, so one
# bad source row costs the day and touches nothing: run 36298272356
# (2026-09-27) logged `ingestion.row_quality_failed salary_bounds=2` and
# `outcome: safety_aborted` with no write to `clean_jobs`, and the dispatch
# 28 minutes later completed. That is the gate working, not a regression.
#
# REVOCATION CONDITION: if a scheduled run fails closed for any other
# reason - config load, schema drift, a robots policy that is no longer
# absent, the yield floor, or the 15-minute ceiling - remove the
# `schedule:` trigger the same day and record the failure. The corpus in
# `clean_jobs` is retained by design; ingestion accumulates rows and never
# truncates them, so a disarm loses no data.

concurrency:
  group: ingestion
  # A run already mid-write must finish rather than be killed partway —
  # partial writes are the risk this guards against. A queued duplicate
  # waits for it instead of running alongside it.
  cancel-in-progress: false

# Least privilege: this workflow only reads the repo and calls the
# ingestion CLI as an external process, so no elevated scope is needed.
# `contents: write` is deliberately NOT granted here — see the keepalive
# note below for why that step is not wired in.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Expected runtime is well under 10 minutes; this is a ceiling that
    # kills a hung run rather than letting it burn Actions minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.15"

      # Mirrors docker/Dockerfile: --frozen matches the lockfile exactly,
      # --no-dev skips the dev dependency group since ingestion imports
      # nothing from it.
      - run: uv sync --frozen --no-dev

      # No migrations run from this workflow. Schema changes go through a
      # deliberate `alembic upgrade head` run by the maintainer (T0019.2's
      # decision) — an unattended job must never migrate a production
      # database.
      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
          # AGENT_DATABASE_URL, GROQ_API_KEY, and Langfuse keys are not read by
          # any ingestion code path. src/core/config.py's Settings model declares
          # them required-no-default and validates at import, so the CLI cannot
          # start without them (verified: check B). These are placeholders to
          # satisfy validation — never real credentials, because ingestion is
          # deterministic and calls no LLM.
          AGENT_DATABASE_URL: "unused-by-ingestion"
          GROQ_API_KEY: "unused-by-ingestion"
          LANGFUSE_SECRET_KEY: "unused-by-ingestion"
          LANGFUSE_PUBLIC_KEY: "unused-by-ingestion"
        run: uv run python -m src.services.ingestion.loader

      # Keepalive step intentionally omitted, not just left uncommented-out
      # as a stub. gautamkrishnar/keepalive-workflow — the action the
      # ticket named — has been disabled by GitHub Staff for violating
      # GitHub's Terms of Service (the repo returns HTTP 403 "Repository
      # access blocked: tos" as of this writing). Reporting on it: the
      # action was designed to circumvent GitHub's 60-day inactivity
      # auto-disable policy, which is itself the ToS violation GitHub
      # cited. No commit SHA can be verified because the repository is
      # inaccessible, and pinning a defunct, ToS-violating action would be
      # worse than leaving the gap. The 60-day auto-disable risk this was
      # meant to cover is logged in docs/Known_Issues.md instead, for a
      # maintainer to address deliberately (e.g. a manual monthly no-op
      # commit, or a from-scratch workflow that only touches this repo).
      # TODO(maintainer): decide how to cover the 60-day inactivity risk.
