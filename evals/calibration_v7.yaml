  trajectory:
  - question: Những việc làm nào cho phép làm việc từ xa?
    answer: "Tôi tìm thấy 2 công việc có đề cập đến việc làm từ xa trong nội dung tin đăng:\n\n1. **AI\
      \ Engineer** - Công Ty Cổ Phần ITL Aviation Logistics\n   - Vị trí: AI Engineer\n   - Công nghệ:\
      \ Python, TensorFlow, AWS\n   - Địa điểm: TP. Hồ Chí Minh\n   - Cấp bậc: Experienced (non-manager)\n\
      \   - Mức lương: 2.000 - 3.500 USD\n   - Không phải thực tập\n\n2. **Home Racer - Data Engineer**\
      \ - Home Credit Vietnam - Explore Your Dream Team\n   - Vị trí: Data Engineer\n   - Công nghệ: Java,\
      \ Spark, Kafka, SQL\n   - Địa điểm: TP. Hồ Chí Minh\n   - Cấp bậc: Experienced (non-manager)\n \
      \  - Mức lương: 20.000.000 - 28.000.000 VND\n   - Không phải thực tập\n\nLưu ý quan trọng: Cơ sở\
      \ dữ liệu không có trường riêng cho thông tin làm việc từ xa. Kết quả trên dựa trên việc tìm kiếm\
      \ trong nội dung tin đăng, nên có thể chưa hoàn toàn chính xác — tin đăng có thể chỉ nhắc đến thuật\
      \ ngữ này một cách lướt qua, hoặc để nói rằng không hỗ trợ làm việc từ xa.\n\nBạn có muốn tôi xem\
      \ chi tiết nội dung của một trong hai công việc này để xác nhận rõ hơn không?"
  human:
    overall: FAIL
    rationale: 'Đưa ra danh sách remote khẳng định (''tôi tìm thấy 2 công việc'') thay vì hedge FREE-TEXT
      (lượt đã biết là FAIL trong baseline #175).'
