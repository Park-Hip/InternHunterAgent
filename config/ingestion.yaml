api:
  url: "https://ms.vietnamworks.com/job-search/v1.0/search"
  hits_per_page: 50
  pages_per_query: 2
  timeout_seconds: 30
  delay_seconds: 0.6
  # Identifies the automated client truthfully for the robots preflight and API.
  user_agent: "InternHunterAgent/1.0 (+https://github.com/Park-Hip/InternHunterAgent)"
  retry_attempts: 2          # retries after the initial attempt (so 3 tries max per page)
  retry_backoff_seconds: 2.0 # base delay; doubles per retry (2s, then 4s)
  # Wall-clock ceiling for the whole fetch, across every query and page. It exists
  # so a dead source ends the run instead of outliving the job that hosts it: on
  # 2026-08-18 every request hung for its full timeout_seconds, which costs
  # 3 x 30 + 2 + 4 = 96s per page, and 16 pages of that is ~26 minutes against the
  # 15-minute timeout-minutes ceiling in .github/workflows/ingestion.yml. The runner
  # cancelled the job, so main() never reached its abort path and logged no reason.
  #
  # The budget is checked before each request, never mid-page, so the true bound is
  # this value plus one page's worst case (~96s) - about 11.6 minutes here, leaving
  # real headroom under the 15-minute ceiling. Raise them together, never this alone.
  max_elapsed_seconds: 600

# Current robots policy for the exact host used by the job API. The source adapter
# fails closed before an API request if this document is unavailable, malformed, or
# disallows target_path for api.user_agent. The reviewed allow_404 exception applies
# only when this exact host has no policy. A successful policy is cached only for one
# source instance, never persisted across runs, and a 404 is never cached.
robots:
  url: "https://ms.vietnamworks.com/robots.txt"
  target_path: "/job-search/v1.0/search"
  cache_ttl_seconds: 300
  allow_404: true

queries:
  - "data scientist"
  - "data engineer"
  - "data analyst"
  - "machine learning"
  - "AI engineer"
  - "MLOps"
  - "computer vision"
  - "deep learning"

job_function:
  parent_id: 5    # "Information Technology/Telecommunications" — IT precision filter
  child_ids: [27] # "Data Engineer/Data Analyst/AI" — AI/Data focus subset

# Safety ceiling, NOT a target. It exists to bound a runaway run, and it now sits
# deliberately above the measured ~50-112 yield (research/data-ingestion-stage.md
# §11) so the API's actual output — not this cap — is what ends a run. Raising it
# does NOT increase per-run request volume: pages_per_query x queries determines
# how many requests are issued, and both are unchanged. It only stops the cap
# from cutting a run short. Re-measure per the §11 runbook; if the real yield
# ever exceeds ~150, raise this again rather than let it bind.
max_jobs: 150

# Lifecycle: time-based soft expiry. A posting absent from search for this many
# consecutive days flips is_active=false. Rows are NEVER deleted.
lifecycle:
  expire_after_days: 7

# Unattended-run safety. min_yield is a pre-write floor: a run that fetches
# fewer than this many postings aborts before touching clean_jobs, so a broken
# fetch can never overwrite good rows. Measured steady state is ~50/run.
safety:
  min_yield: 20

# ---------------------------------------------------------------------------
# Collection plans: the declared intent of one collection run, one entry per
# source. A plan says what a run intends to ask for BEFORE anything is sent, and
# it is stored with the run so a reviewer can walk from an agent-visible value
# back to the exact request that produced it. A plan is a declaration, never
# evidence that the declaration was met, and never reconstructed from a response.
#
# A string of the form "@path.to.key" is resolved from this same file, so a plan
# can never drift from the operational value an adapter actually reads. Every
# other value is a literal. A reference that does not resolve is a
# configuration error, never a default, and never an empty value.
#
# Keys every plan declares:
#   version_prefix          prepended to the content digest that versions the plan.
#   authorization_revision  the gate register row the plan relies on. The shadow
#                           writer refuses anything not prefixed "synthetic:".
#   retrieval_precision     the precision a run may round a retrieval time to.
#   completion_rule         the terminal condition an adapter must record before
#                           a run may read "complete". State the condition; when
#                           no condition exists, say so.
#   declared_scope          the request, the stop condition, and the provider
#                           state machine the adapter accepts.
#   declared_caps           at most one cap: the record cap the run may not exceed.
#                           A run records it beside the count that came back, so a
#                           second cap has nowhere honest to go. A request parameter
#                           that merely travels in the body belongs in declared_scope.
#                           No cap at all means "no cap declared", not zero.
#   requested_fields        every field the plan asks for, with its meaning. A
#                           field the plan does not request is not available
#                           evidence even when the source returns it.
#   declared_endpoints      every endpoint the adapter may address. A request
#                           outside this set aborts the run.
#
# Per-field request declarations ("request_body", "query_parameters",
# "omitted_discovery_inputs") belong to a provider that issues exactly one
# request shape. They are absent where a plan is fully described by the values
# above, as VietnamWorks is.
# ---------------------------------------------------------------------------
plans:
  vietnamworks:
    # VietnamWorks is the one authorized source (ADR-0034, G1 met). Its plan is
    # a fixture plan: it describes the existing search and sends nothing. The
    # synthetic prefix is what the shadow writer requires while G2 reads Not met.
    version_prefix: "synthetic-"
    authorization_revision: "synthetic:fixture-only"
    retrieval_precision: "microsecond"
    completion_rule: >-
      every declared page succeeded and the search reached its terminal bound
    declared_scope:
      queries: "@queries"
      pages_per_query: "@api.pages_per_query"
      hits_per_page: "@api.hits_per_page"
      job_function: "@job_function"
    declared_caps:
      max_jobs: "@max_jobs"
    declared_endpoints:
      search: "@api.url"
    requested_fields:
      jobId: "source listing key"
      jobUrl: "source URL"
      jobTitle: "display title"
      companyName: "display company"
      jobDescription: "description"
      jobRequirement: "requirements"
      jobLevel: "source level"
      jobLevelVI: "source level VI"
      skills: "source skills"
      address: "source address"
      workingLocations: "source locations"
      benefits: "source benefits"
      expiredOn: "source expiry"
      createdOn: "source creation"
      salaryMin: "salary minimum"
      salaryMax: "salary maximum"
      salaryCurrency: "salary currency"
      isSalaryVisible: "salary visibility"
      jobFunction: "source job function"

  # Bright Data is the acquisition provider; LinkedIn is the claimed origin
  # platform, supported only by the www.linkedin.com host in observed `url`
  # values. A provider identifier is not a source identifier, so the source
  # namespace names both.
  #
  # NO COLLECTION FROM THIS SOURCE IS AUTHORIZED. Both Bright Data rows of
  # docs/refactor/ingestion-gate-register.md read Not met, and the open
  # maintainer action on the key exposed in #423 blocks G1 specifically. The
  # adapter is built; the run is not taken. This plan declares a request the
  # project may not send, which is exactly what makes the boundary reviewable:
  # a request body, a cap, a field selector, and an endpoint set, all legible
  # without a credential.
  #
  # Do not replace the authorization revision with a real one to "unblock" a
  # run. Changing it is a gate-owner action taken after the register rows read
  # met, and the first live run is a separately authorized activity.
  linkedin_via_brightdata:
    version_prefix: "synthetic-"
    authorization_revision: "synthetic:recorded-provider-responses"
    retrieval_precision: "millisecond"
    # Never satisfiable, and stated that way on purpose. The provider returns no
    # cursor, no next link, no total count, and no completion flag, and the
    # bounded observation saw an observed count equal to its declared cap, which
    # cannot separate an exhausted scope from a truncated one. No run of this
    # plan may therefore read "complete".
    completion_rule: >-
      unsatisfiable - the provider exposes no terminal-completeness signal, so
      no run of this plan may attest a terminal condition
    declared_scope:
      # The request exactly as submitted. The observation retained the request
      # digests but not the request itself, so the body shape and the
      # query-parameter placement below come from the provider's documented
      # keyword-discovery schema and from the request-of-record table in
      # docs/discovery/research/bright-data-bounded-observation-470.md. The
      # first live run must confirm it against the provider's own schema.
      request_body:
        input:
          - location: "Hanoi"
            keyword: "AI Engineer"
            country: "VN"
            time_range: "Past month"
            # Documented as a boolean filter. The echo renders every discovery
            # input as a string, so the submitted JSON type is not recoverable
            # from the observed response.
            selective_search: true
        limit_per_input: 10
        # Sent on the query string and in the body, because both placements are
        # documented and the bounded observation sent both.
        custom_output_fields: "url|job_posting_id|job_title|company_name|job_location|job_posted_date|job_posted_time|job_seniority_level|job_employment_type|apply_link|country_code|application_availability|discovery_input"
      query_parameters:
        dataset_id: "gd_lpfll7v5hcqtkxl6l"
        type: "discover_new"
        discover_by: "keyword"
        notify: "false"
        include_errors: "true"
        format: "json"
        custom_output_fields: "url|job_posting_id|job_title|company_name|job_location|job_posted_date|job_posted_time|job_seniority_level|job_employment_type|apply_link|country_code|application_availability|discovery_input"
      # Declared so an omitted input stays distinguishable from one submitted as
      # an empty string. The observed provider echo rendered all five omitted
      # filters as empty strings, so the echo cannot evidence the omission; the
      # absence here, in the request body above, is the record of it.
      omitted_discovery_inputs:
        - "job_type"
        - "experience_level"
        - "remote"
        - "company"
        - "jobs_to_not_include"
        - "location_radius"
      # A named secret location, never a value. No credential is read at test
      # time, and none is stored: the request body and the retained request
      # record carry no credential material.
      credential_env: "BRIGHTDATA_API_KEY"
      # The provider state machine the adapter accepts. A status outside this
      # vocabulary is schema drift, and the run fails closed on it.
      progress_states:
        - "starting"
        - "running"
        - "ready"
        - "failed"
        - "canceled"
      terminal_states:
        - "ready"
        - "failed"
        - "canceled"
      # Bounded polling. The bounded retry-after was 30 seconds and the one
      # observed poll returned ready, so four polls is a ceiling, not a target.
      max_progress_polls: 4
      default_retry_after_seconds: 30
    declared_caps:
      limit_per_input: 10
    declared_endpoints:
      submit: "https://api.brightdata.com/datasets/v3/scrape"
      progress: "https://api.brightdata.com/datasets/v3/progress/{snapshot_id}"
      snapshot: "https://api.brightdata.com/datasets/v3/snapshot/{snapshot_id}"
    requested_fields:
      url: >-
        origin-platform listing URL; every observed value was on the
        www.linkedin.com host, which supports LinkedIn as the claimed origin
        platform and nothing more
      job_posting_id: >-
        candidate origin-platform listing key; present and distinct in every
        observed record, but stability across time is unmeasured
      job_title: "display title"
      company_name: "display company"
      job_location: "free-form location text"
      job_posted_date: >-
        ISO 8601 timestamp with a Z suffix; the provider documents no event
        semantics and no timezone policy, so it is retained and never used as a
        posted date
      job_posted_time: >-
        relative posted time in the provider's own "ago" form; it is not a date
        and is never parsed as one
      apply_link: >-
        application link; observed present and explicitly null in every record,
        which is a provider assertion that no value exists, not a closed or
        expired listing
      country_code: >-
        country of the listing; observed present and explicitly null in every
        record despite an exactly echoed country filter, so it carries no
        country evidence and is never filled from the request
      job_seniority_level: >-
        exact source level label; not technical seniority and not leadership
        scope, both of which stay unknown
      job_employment_type: "exact source employment-type label"
      application_availability: >-
        provider boolean; observed true beside an explicitly null apply_link in
        every record, so it does not imply that an application link exists
      discovery_input: >-
        provider-generated echo of the submitted acquisition context; it
        rendered omitted filters as empty strings, so it cannot distinguish an
        omitted filter from an empty one, and it is never a source fact

