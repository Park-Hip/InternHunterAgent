evidence:
  retrieved_on: "2026-08-21"
  source: https://api-docs.deepseek.com/quick_start/pricing/
  corroborating_source: https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
  unit: USD per token
  notes: >-
    DeepSeek publishes these prices per one million tokens. The English and Chinese first-party
    pricing pages both list $0.0028/M cache-hit input, $0.14/M cache-miss input, and $0.28/M
    output for deepseek-v4-flash. Cache-hit input is a separate, mutually exclusive usage bucket
    from cache-miss input.

models:
  - model_name: deepseek-v4-flash
    match_pattern: "(?i)^deepseek-v4-flash$"
    start_date: "2026-08-21T00:00:00Z"
    unit: TOKENS
    pricing_tiers:
      - name: default
        is_default: true
        priority: 0
        conditions: []
        prices:
          input: 0.00000014
          input_cached_tokens: 0.0000000028
          output: 0.00000028
