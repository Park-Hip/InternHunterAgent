api:
  docs_enabled: true
  rate_limit: "15/minute"
  max_query_chars: 2000
  stream_heartbeat_seconds: 15  # SSE comment cadence; keep below normal proxy idle windows.
  demo:
    data_snapshot_date: "2026-07-14"  # Update whenever the shipped demo corpus changes.
  cors:
    allowed_origins: []  # Set deployed/demo UI origin(s) here later; keep empty for same-origin or no-browser use.
    allow_credentials: false
    allowed_methods: ["GET", "POST", "OPTIONS"]
    allowed_headers: ["*"]

observability:
  langfuse:
    # Environments partition whole processes. The evaluation driver binds its
    # own environment before importing the agent runtime.
    environments:
      default: local
      allowed: [local, production, evaluation]
    # These are the only dimensions allowed to become Langfuse tags. Keep this
    # vocabulary intentionally small so trace filtering remains usable.
    tag_taxonomy:
      entry_points: ["api:chat", "api:chat-stream", "eval:driver", "eval:spike"]

agent:
  # Default provider for every profile. A profile may override it with its own
  # `provider:` key, which is how one profile moves arms while the other stays put.
  # Change `provider` and `model` together - a model name belongs to one provider.
  # Native knobs below are read only by their own provider's branch:
  #   groq     -> reasoning_format, reasoning_effort
  #   deepseek -> thinking (disabled | enabled; enabled means the provider default, on)
  # Serving moved to deepseek on measured throughput (D-045). The groq knobs stay so the
  # other arm is one edit away: set both profiles back to `groq` / `qwen/qwen3.6-27b` and
  # restore `eval.driver.turn_pacing_seconds: 75`.
  provider: deepseek
  # End-to-end serving deadline for one SSE turn. Invalid or omitted values fall
  # back to 120 seconds so one blocked stream cannot occupy the sole web worker.
  stream_turn_timeout_seconds: 120

  react:
    provider: deepseek
    model: deepseek-v4-flash
    temperature: 0.2
    max_tokens: 2048
    timeout: 30
    max_retries: 2
    streaming: true
    stream_usage: true
    reasoning_format: hidden
    reasoning_effort: null
    thinking: disabled  # deepseek ignores temperature while thinking is on (T0027.1)

  sql_generation:
    provider: deepseek
    model: deepseek-v4-flash
    temperature: 0.0
    max_tokens: 1024
    timeout: 30
    max_retries: 2
    streaming: false
    stream_usage: false
    reasoning_format: hidden
    reasoning_effort: none
    thinking: disabled  # this profile's determinism depends on temperature: 0.0

  memory:
    max_turns: 6
    compaction:
      trigger_messages: 48
      keep_messages: 12
  query:
    max_rows: 20
    max_detail_ids: 3
    obligations:
      enabled: true
      zero_results: true
      created_on: true
      free_text: true
      cross_currency: true
      negotiable_salary: true
      listing_expiry: true

eval:
  judge:
    provider: google       # Google AI Studio (Gemini API); was openrouter (ox-alpha), before that groq
    model: gemma-4-31b-it  # served by AI Studio directly; OpenRouter fallback stays available in build_judge()
    temperature: 0.0
    rpm: 10                # 16k TPM free-tier cap binds before the 30 RPM cap at ~1k tok/judge call; measured on the #239 probe
    timeout_seconds: 120   # client socket timeout; default 30 was too tight for gemma CoT prompts that take 50-90s to score (measured on #266 retries of hlp-referent/hlp-senior-title/hlp-abstraction FAIL cases)
  fixture:
    database_url: postgresql+psycopg://internhunter:internhunter@localhost:5433/internhunter_eval
  driver:
    # Seconds to wait between turns. This exists only to survive a per-minute token
    # ceiling: one agent turn asks for ~9.2k tokens (inputs plus each call's max_tokens
    # reserve) across its routing, SQL, and synthesis calls, and Groq's free tier admits
    # 8000 TPM, so a turn only lands from an idle window and retrying inside a filled one
    # can never recover. DeepSeek publishes no TPM or TPD limit, only account concurrency,
    # and the driver runs one turn at a time - so the serving default needs no pacing.
    # Restore 75 together with the groq arm; the T0027.3 capture ran 77 turns at 0.
    turn_pacing_seconds: 0
  # Serving prices in USD per million tokens, read only by the trace viewer's cost
  # dashboard. They are estimates - verify against the provider price page before
  # quoting any number outside this repository.
  pricing_usd_per_mtok:
    deepseek-v4-flash: { input: 0.28, output: 0.42 }
    qwen/qwen3.6-27b: { input: 0.59, output: 0.79 }
  writeback:
    # Delays between verification attempts after a capture flushes to Langfuse.
    # The ladder is short because the question is "did this arrive at all", not
    # "how fast". Cloud ingestion is asynchronous and batched; a capture of two
    # scenarios finishes in seconds, well inside that window.
    ingestion_retry_delays: [0.0, 2.0, 5.0]
  replay:
    # Default committed replay artifact when --replay is omitted.
    default_path: "t0025.9-committed.json"
    # Historical captures preserved under evals/archive/replays/ (issue #148/#249).
    # They keep their original bytes and provenance but are no longer current
    # regression evidence: the registry moved on, so they no longer validate.
    # To add a new archived name, copy the format below and keep the set sorted.
    archived_names:
      - "t0024.4-v3-obligations.json"
      - "t0025.7-acceptance.json"
      - "v6-baseline-20260823.json"
      - "iha243-honesty-v9.json"
  langfuse:
    # These three strings are coupled: renaming one requires renaming all three
    # and ensuring every capture that references the prefix still lands in the
    # same dataset. The prefix forms the start of every item id.
    dataset_name: "internhunteragent-scenarios-v1"
    dataset_description: "Derived mirror of evals/scenarios_v1.yaml. Do not edit in Langfuse."
    item_id_prefix: "internhunteragent-scenarios-v1:"
  viewer:
    # Sampling knobs treated as "standard" (displayed first) in the trace viewer.
    # New knobs that deserve first-class treatment should be added here; otherwise
    # they fall through to the dynamic list.
    fixed_sampling_keys: ["temperature", "max_tokens"]
  grader:
    # Maximum number for the Vietnamese/English number-word lookup used by
    # _answer_count. Values beyond this bound fall back to digit matching only.
    number_words_max: 100
    # Canonical English tech terms that may appear verbatim in Vietnamese prose.
    # Extend this list when new terms appear in job postings without triggering
    # the vietnamese_agent_prose check.
    allowed_tech_terms:
      - "AI"
      - "SQL"
      - "Python"
      - "Data"
      - "ML"
      - "Remote"
      - "React"
      - "Docker"
      - "JavaScript"
      - "TypeScript"
      - "Backend"
      - "Frontend"
      - "Fullstack"
      - "Java"
      - "Go"
      - "Rust"
      - "Kotlin"
      - "Swift"
      - "PHP"
      - "Ruby"
      - "Node"
      - "AWS"
      - "GCP"
      - "Azure"
      - "Linux"
      - "Git"
      - "API"
      - "REST"
      - "GraphQL"
    # Canonical structured job levels that the grader validates against returned
    # row values. If the fixture vocabulary changes, update both here and the
    # fixture seed so the health-check test stays green.
    structured_job_levels:
      - "Experienced (non-manager)"
      - "Manager"
      - "Fresher/Entry level"
      - "Intern/Student"
      - "Director and above"
    # Payment-period vocabulary accepted by the salary_period check, grouped by
    # language. Each group is merged into a single alternation inside the regex.
    salary_period_terms:
      english:
        - "monthly"
        - "yearly"
        - "hourly"
        - "per month"
        - "per year"
        - "per hour"
      vietnamese:
        - "tháng"
        - "thang"
        - "năm"
        - "nam"
        - "giờ"
        - "gio"
