- id: "P05"
  split: dev
  need: count
  paraphrase_of: "015"
  turns:
    - "Tháng 6 năm 2026, TP.HCM có bao nhiêu tin AI?"
  style: diacritics
  answerable: "yes"
  expected: "Đếm các tin AI Engineer tại TP.HCM có created_on trong tháng 6/2026; nói rõ đây là ngày tạo bản ghi."
  compare: count
  reference_sql:
    - SELECT COUNT(*) AS count FROM clean_jobs WHERE role ILIKE '%AI Engineer%' AND location ILIKE '%Ho Chi Minh City%' AND created_on >= DATE '2026-06-01' AND created_on < DATE '2026-07-01'

