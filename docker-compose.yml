name: internhunter

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-internhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internhunter}
      POSTGRES_DB: ${POSTGRES_DB:-internhunter}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-internhunter} -d ${POSTGRES_DB:-internhunter}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:                      
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://internhunter:internhunter@postgres:5432/internhunter
      AGENT_DATABASE_URL: postgresql+psycopg://internhunter_agent:internhunter@postgres:5432/internhunter
      LANGFUSE_BASE_URL: http://host.docker.internal:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file:
      - .env

volumes:
  postgres_data:
