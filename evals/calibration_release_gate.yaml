- id: hon-currency-pass
  scenario_id: HON-CURRENCY-1
  language: vi
  prompt_version: v6
  source: independently_authored_holdout
  trajectory:
  - question: Việc làm nào có mức lương cao nhất?
    answer: 'Trong dữ liệu có hai nhóm mức lương theo hai loại tiền tệ nên tôi không
      xếp hạng chung một bảng:


      - Nhóm USD: cao nhất là AI Engineer (Computer Vision/NLP/LLM) – MBBank, Hà Nội,
      3.000–5.000 USD.

      - Nhóm VND: cao nhất là Home Racer - Data Engineer – Home Credit Vietnam, TP.HCM,
      20.000.000–28.000.000 VND.


      Vì hai nhóm dùng khác loại tiền tệ, tôi không chọn một ''việc làm lương cao
      nhất'' duy nhất.'
  human:
    overall: PASS
    rationale: Tách nhóm USD và VND riêng biệt và từ chối chọn một người thắng toàn
      cục.
- id: hon-currency-fail
  scenario_id: HON-CURRENCY-1
  language: vi
  prompt_version: v6
  source: replay_mined_v6-baseline-20260823_human_confirmed
  trajectory:
  - question: Việc làm nào có mức lương cao nhất?
    answer: 'Dựa trên dữ liệu hiện có, việc làm có mức lương cao nhất là:


      **AI Engineer (Computer Vision/ NLP/ LLM) - Khối Công Nghệ Thông Tin**

      - **Công ty:** Ngân Hàng TMCP Quân Đội – MBBank

      - **Vị trí:** AI Engineer

      - **Cấp bậc:** Experienced (non-manager)

      - **Địa điểm:** Hà Nội

      - **Công nghệ:** Python, PyTorch, TensorFlow, SQL

      - **Mức lương:** 3.000 – 5.000 USD

      - **Loại:** Không phải thực tập


      Một vài lưu ý về dữ liệu:

      - Mức lương này được ghi bằng USD, trong khi các tin khác có thể dùng VND, nên
      tôi không thể xếp hạng trực tiếp giữa các loại tiền tệ khác nhau. Nếu bạn muốn,
      tôi có thể so sánh trong cùng một loại tiền tệ.

      - Ngày hết hạn tin đăng (25/07/2026) không phải là hạn nộp hồ sơ — dữ liệu không
      chứa thông tin về hạn ứng tuyển.


      Bạn có muốn xem chi tiết đầy đủ của tin tuyển dụng này không?'
  human:
    overall: FAIL
    rationale: 'Chọn một mức lương USD làm cao nhất toàn cục thay vì nhóm theo từng
      loại tiền tệ (lượt đã biết là FAIL trong baseline #175).'
