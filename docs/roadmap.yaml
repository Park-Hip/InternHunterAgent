# InternHunter - the allocation registry for ticket and milestone identity.
#
# This file is the sole owner of "which number belongs to which work", and of which paths
# a milestone is allowed to change. Nothing else allocates a number. An agent that needs
# one stops and asks; it never infers the next free number from docs/Tickets.md.
#
# Inferring the number from a document is what produced every numbering defect in this
# repository's history: M23 is indexed but was never scoped while M26, M27 and M28 shipped
# past it; PR #48 shipped titled "M25/T0026" against documentation that calls the same work
# M26; and feature/t0031-parallel-agent-docs existed with a worktree and no ticket body on
# any branch. A fourth surfaced on 2026-08-17: worktree-t0027.1-restore-serving-path numbered
# its work T0029.1 "because M27 and M28 are taken on main", while T0029.1 on main is the
# viewer-readability ticket. That work was an incident, which needs no number at all; it is
# recorded in docs/Resolved_Issues.md and preserved as archive/serving-outage-2026-08-13.
#
# Milestone N owns tickets T00NN.x. That coupling is deliberate and stays - one number is
# cheaper to arbitrate than two. What changed is that the number is claimed here, before an
# agent starts, instead of being written by whichever agent finishes first.
#
# status:
#   complete    - shipped; plan archived in docs/archive/Tickets_Archive.md.
#   in-progress - an agent is working it on `branch`.
#   claimed     - the number is taken and a branch may exist; no ticket body yet.
#   planned     - indexed on the roadmap, not scoped, no branch.
#
# scope:
#   The paths this milestone's tickets may change. Before launching agents in parallel,
#   intersect their scopes: a non-empty intersection means they are NOT independent, and
#   must be sequenced instead. Widening a scope is a one-line edit here, made in the same
#   PR that needs it - the declaration exists to force that decision early, not to block it.

