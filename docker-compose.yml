services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-internhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internhunter}
      POSTGRES_DB: ${POSTGRES_DB:-internhunter}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-internhunter} -d ${POSTGRES_DB:-internhunter}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
