name: CI

on:
  pull_request:
    branches: [main]

# Least privilege: the gate only reads the repo and runs local checks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crew-progress-report:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - shell: powershell
        run: .\scripts\test_crew_progress_report.ps1

      - shell: powershell
        run: .\scripts\test_crew_lifecycle.ps1

  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - run: node --check extension.js
        working-directory: vscode/crew-launcher

      - run: node --test
        working-directory: vscode/crew-launcher

  docs:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.15"

      - run: uv run python scripts/docs_lint.py

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: internhunter
          POSTGRES_PASSWORD: internhunter
          POSTGRES_DB: internhunter_eval
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U internhunter -d internhunter_eval"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Dummy values — the standard suite mocks the DB and LLMs; these only
      # satisfy Settings validation at load. NEVER real credentials.
      GROQ_API_KEY: "unused-in-ci"
      DATABASE_URL: "postgresql+psycopg://ci:ci@localhost:5432/ci"
      AGENT_DATABASE_URL: "postgresql+psycopg://ci_agent:ci@localhost:5432/ci"
      LANGFUSE_SECRET_KEY: "unused-in-ci"
      LANGFUSE_PUBLIC_KEY: "unused-in-ci"
      # Importing deepeval otherwise phones home. The replay gate claims to make
      # no outbound call, so keep that literally true.
      DEEPEVAL_TELEMETRY_OPT_OUT: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.15"
          # Cache the uv download/build cache (~/.cache/uv), keyed on uv.lock.
          # Cold run still pays full install; warm runs skip re-downloading and
          # rebuilding the heavy dev deps (deepeval et al.), the dominant cost.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Includes the dev group (mypy/ruff/pytest) — do NOT use --no-dev here.
      - run: uv sync --frozen

      - run: uv run ruff check .

      - run: uv run mypy

      # eval-marked tests are auto-deselected by pyproject addopts; do not add -m.
      - run: uv run pytest -q

      # This validates the committed evidence, executes recorded SQL against the
      # frozen fixture, and runs deterministic grading. It does not call a model
      # or the optional judge.
      - run: uv run python -m evals.fixtures.loader

      - run: uv run python -m evals.replay

  migration-check:
    name: Migration chain & ORM sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: internhunter
          POSTGRES_PASSWORD: internhunter
          POSTGRES_DB: internhunter_eval
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U internhunter -d internhunter_eval"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Connect to the real Postgres service for the migration chain.
      ALEMBIC_DATABASE_URL: "postgresql+psycopg://internhunter:internhunter@localhost:5433/internhunter_eval"
      DATABASE_URL: "postgresql+psycopg://internhunter:internhunter@localhost:5433/internhunter_eval"
      AGENT_DATABASE_URL: "postgresql+psycopg://internhunter_agent:internhunter@localhost:5433/internhunter_eval"
      # Dummy values — only needed to satisfy Settings validation at load.
      GROQ_API_KEY: "unused-in-ci"
      LANGFUSE_SECRET_KEY: "unused-in-ci"
      LANGFUSE_PUBLIC_KEY: "unused-in-ci"
      DEEPEVAL_TELEMETRY_OPT_OUT: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen

      # G1: Prove the chain can take a blank database to head.
      - name: Upgrade blank database to head
        run: uv run alembic upgrade head

      # G2: Prove the ORM metadata is not ahead of the revision chain.
      - name: Check ORM metadata matches migration chain
        run: uv run alembic check

  release-gate:
    name: Live semantic release gate
    # Bounded live smoke suite — only runs on protected-merge and release-candidate
    # paths.  Does NOT run on ordinary pull requests, preserving the provider-free
    # replay lane as the PR gate.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Require a live judge provider key — the gate must call a real model to
      # measure semantic behaviour against the calibration corpus.  The key is
      # injected from repository secrets, never hardcoded.
      DEEPEVAL_TELEMETRY_OPT_OUT: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen

      # Collect the eval-marked suite (the bounded live smoke suite).  The
      # project's addopts exclude eval tests from the default run; this step
      # opts them back in.  The release-gate test enforces RELEASE_THRESHOLD
      # and fails closed on zero collection or any class-level recall breach.
      - name: Run live semantic release gate
        run: uv run pytest -m eval -v

