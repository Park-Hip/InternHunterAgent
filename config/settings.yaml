database:
  # Bounds every connection attempt (TCP, TLS, authentication) the process
  # makes: boot guards, agent queries, and checkpointer pool workers. The value
  # wins over any connect_timeout in a DSN, and libpq's own default would wait
  # forever, so an unreachable database refuses boot instead of hanging it.
  connect_timeout_seconds: 10

api:
  docs_enabled: true
  rate_limit: "15/minute"
  max_query_chars: 2000
  stream_heartbeat_seconds: 15  # SSE comment cadence; keep below normal proxy idle windows.
  demo:
    # Static last resort for /api/v1/ready, returned only when the
    # MAX(last_seen_at) query over clean_jobs returns NULL or raises.
    # Not a claim about the corpus: documentation and UI read the measured
    # value from the endpoint. Do not advance this string to look current -
    # a fallback that is never surfaced would only become a second stale
    # date, invalidated by the next ingest run.
    data_snapshot_date: "2026-08-27"
  cors:
    allowed_origins: []  # Set deployed/demo UI origin(s) here later; keep empty for same-origin or no-browser use.
    allow_credentials: false
    allowed_methods: ["GET", "POST", "OPTIONS"]
    allowed_headers: ["*"]

observability:
  langfuse:
    # Environments partition whole processes: set LANGFUSE_TRACING_ENVIRONMENT
    # to classify a process, or leave the default for a local run.
    environments:
      default: local
      allowed: [local, production, evaluation]
    # These are the only dimensions allowed to become Langfuse tags. Keep this
    # vocabulary intentionally small so trace filtering remains usable.
    tag_taxonomy:
      entry_points: ["api:chat-stream", "eval:spike"]

agent:
  # Named deployments are the serving allowlist. Model names must use LiteLLM's
  # lowercase provider-qualified form; the provider is read from that prefix, so
  # there is no separate provider key to keep in sync. `api_key_env` names a
  # deployment environment variable. It never contains a secret.
  providers:
    deepseek_flash:
      model: deepseek/deepseek-flash
      api_key_env: DEEPSEEK_API_KEY

  # End-to-end serving deadline for one SSE turn. Required: a missing,
  # non-integer, boolean, or non-positive value refuses boot (ADR-0048, amended
  # by #656), so one blocked stream cannot occupy the sole web worker unbounded.
  stream_turn_timeout_seconds: 120
  prompts:
    # Fetch one explicit deployment label, never mutable `latest`. The checked-in
    # config/prompts.yaml text is a release-pinned fallback for an unavailable client.
    deployment_label: production
    cache_ttl_seconds: 60
    # Boot resolves every surface once and a background task refreshes the link
    # afterwards; a turn only reads memory, so Langfuse being slow or down cannot
    # delay it (#698). One fetch is bounded by fetch_timeout_seconds and is never
    # retried: the next refresh interval is the retry.
    fetch_timeout_seconds: 2
    refresh_interval_seconds: 300

  react:
    deployment: deepseek_flash
    temperature: 0.2
    max_tokens: 2048
    timeout: 30
    max_attempts: 2
    streaming: true
    provider_options:
      # DeepSeek ignores temperature when thinking is enabled (T0027.1).
      thinking: disabled

  sql_generation:
    deployment: deepseek_flash
    temperature: 0.0
    max_tokens: 1024
    timeout: 30
    max_attempts: 2
    streaming: false
    provider_options:
      # This profile's determinism depends on temperature: 0.0.
      thinking: disabled

  memory:
    # The model's window: each model call is trimmed to the most recent
    # max_turns complete turns, and the stored thread is never rewritten.
    # Validated once at load (#672).
    max_turns: 6
    # Storage bound: the serving process deletes every thread whose newest
    # checkpoint is older than this many days, with its blobs and writes
    # (once at boot, then daily). Validated once at load (#673).
    retention_days: 30
  query:
    max_rows: 20
    max_detail_ids: 3
    # Every generated statement runs inside a read-only transaction on the
    # least-privilege agent role, with a server-side statement timeout and a
    # byte budget on the returned rows. Neither replaces the other.
    # These two are read by the v1 executor (src/services/query/executor.py),
    # which is the only execution path; the v0 core that first owned them was
    # deleted with the rest of the bundle (ADR-0060, step 3).
    statement_timeout_ms: 2000
    max_result_bytes: 262144

eval:
  baseline:
    # Layer 1 is one temperature-0 generation per question: repetition adds no
    # information when the profile is deterministic, so it stays at one.
    layer1_repeats: 1
    # The agent run repeats every conversation. The runner records the count in
    # the run, and scoring reports per-repeat rows so variance stays visible
    # rather than being averaged away (#760, 5f).
    agent_repeats: 3
  fixture:
    # Owner DSN: only the fixture loader builds and seeds with it.
    database_url: postgresql+psycopg://internhunter:internhunter@localhost:5433/internhunter_eval
    # Non-owner reader DSN: the evaluation tool and scoring path. The loader
    # provisions this role with column-level SELECT on the 16 contract columns,
    # mirroring production's internhunter_agent role (#730).
    reader_database_url: postgresql+psycopg://internhunter_eval_reader:internhunter_eval@localhost:5433/internhunter_eval
