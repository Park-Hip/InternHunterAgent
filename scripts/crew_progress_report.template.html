<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crew progress report</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f4f7fb; color: #172033; }
    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem 3rem; }
    header { border-bottom: 3px solid #1f6feb; margin-bottom: 1.5rem; }
    h1 { margin: 0 0 .25rem; } h2 { margin: 0 0 .7rem; font-size: 1.1rem; }
    section { background: #fff; border: 1px solid #d8dee9; border-radius: .5rem; margin: 1rem 0; padding: 1rem; }
    .empty { color: #596579; font-style: italic; }
    .warning { border-color: #c97a00; background: #fff8e6; }
    ul { margin: .3rem 0; padding-left: 1.3rem; } li { margin: .35rem 0; }
    table { width: 100%; border-collapse: collapse; } th, td { padding: .55rem; text-align: left; border-top: 1px solid #d8dee9; vertical-align: top; }
    th { background: #edf3ff; } code { white-space: pre-wrap; word-break: break-word; }
    .badge { display: inline-block; border-radius: 1rem; padding: .1rem .5rem; font-size: .85rem; font-weight: 600; background: #e7edf7; }
    .badge.waiting, .badge.failed { background: #ffe0b2; color: #633b00; }
    .badge.dispatchable, .badge.green { background: #d9f7df; color: #075b23; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #e5e7eb; } section { background: #1f2937; border-color: #4b5563; }
      th { background: #25334b; } .empty { color: #b5c0d2; } .warning { background: #3b2d12; border-color: #d99720; }
    }
  </style>
</head>
<body>
  <main>
    {{REPORT_BODY}}
  </main>
</body>
</html>
