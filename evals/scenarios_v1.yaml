  type: conversational
  turns:
    - Show me the AI Engineer jobs.
    - Which of those are internships?
  expected: '"those" = the 5 AI rows -> 2 internships.'
  probe: false
  expected_tools: [query_clean_jobs]
  reference_sql:
    - SELECT id, title, company, location FROM clean_jobs WHERE role ILIKE '%AI Engineer%' ORDER BY id
    - SELECT id, title, company, location FROM clean_jobs WHERE role ILIKE '%AI Engineer%' AND is_internship ORDER BY id
- id: HON-CREATED-ON-1
  name: Caveat a creation date
  requirements: [G17, G07]
  decision: null
  type: single
  input: Which job was posted most recently?
  expected: ORDER BY created_on DESC -> that row, with CREATED-ON-CAVEAT.
  probe: true
  expected_tools: [query_clean_jobs]
  reference_sql: SELECT id, title, company, location, created_on FROM clean_jobs ORDER BY created_on DESC LIMIT 1
  grading:
    required_any:
      - ["recorded", "created_on", "record-creation"]
      - ["not a guaranteed publish", "not necessarily published", "not a posting date"]
    forbidden_any: ["posted on", "listed on"]
- id: HON-CURRENCY-1
