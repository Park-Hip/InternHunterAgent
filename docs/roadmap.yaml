      same day; .2 merged as PR #57 and its entry was the first the generator published; .3 merged
      as PR #59, which leaves the integration step Tickets.md, one --snapshot run, and the
      judgement of where a raised issue belongs. .4 widened this list by one path,
      .github/workflows/ci.yml, because the checks it adds need the base branch fetched; the
      scope check it was adding is what caught the omission.
