# Paraphrases of a subset of the dev corpus (#761).
#
# One dev question, asked another way, with the same reference SQL and the same
# comparison mode. They are dev cases: a prompt or tool change may be tuned
# against them. The point is wording sensitivity, so a paraphrase must not be a
# copy of the original turn and must not change the answer.
#
# `paraphrase_of` names the dev case. The loader refuses a paraphrase whose
# reference SQL or comparison mode differs from the case it paraphrases.
# answerable is a quoted enum: "yes", "no", or "partial".

- id: "P01"
  split: dev
  need: find
  paraphrase_of: "001"
  turns:
    - "Có internship nào cho AI Engineer không?"
  style: diacritics
  answerable: "yes"
  expected: "Lọc is_internship = TRUE và role AI Engineer, trả về các tin phù hợp cùng link gốc."
  compare: ids
  reference_sql:
    - SELECT id FROM clean_jobs WHERE is_internship = TRUE AND role ILIKE '%AI Engineer%'

