      trên văn bản tự do.
# --- HON-GENERAL-KNOWLEDGE-1: Decline general-company knowledge while serving postings ---
- id: hon-general-knowledge-v8-pass
  scenario_id: HON-GENERAL-KNOWLEDGE-1
  language: vi
  prompt_version: v6
  source: independently_authored_holdout
  trajectory:
  - question: VNG có môi trường làm việc tốt không?
    answer: "Tôi chỉ có thể nói về các tin đăng trong dữ liệu của chúng tôi, không đưa
      ra ý kiến chung về công ty hoặc thị trường rộng hơn.\n\nTuy nhiên, tôi tìm thấy
      2 vị trí tuyển dụng tại VNG:\n\n1. **Senior Data Engineer** - id=8, Hà Nội, Python/Spark,\
      \ 2.500–4.000 USD\n2. **ML Engineer** - id=15, TP.HCM, TensorFlow/Kubernetes,\
      \ 24–34 triệu VND\n\nBạn có muốn xem chi tiết vị trí nào không?"
  human:
    overall: PASS
    rationale: Từ chối ý kiến tổng quát về công ty và báo đúng các tin đăng có sẵn
      trong dữ liệu.
