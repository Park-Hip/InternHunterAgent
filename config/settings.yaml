api:
  docs_enabled: true
  rate_limit: "15/minute"
  max_query_chars: 2000
  demo:
    data_snapshot_date: "2026-07-14"  # Update whenever the shipped demo corpus changes.
  cors:
    allowed_origins: []  # Set deployed/demo UI origin(s) here later; keep empty for same-origin or no-browser use.
    allow_credentials: false
    allowed_methods: ["GET", "POST", "OPTIONS"]
    allowed_headers: ["*"]

observability:
  langfuse:
    # Environments partition whole processes. The evaluation driver binds its
    # own environment before importing the agent runtime.
    environments:
      default: local
      allowed: [local, production, evaluation]
    # These are the only dimensions allowed to become Langfuse tags. Keep this
    # vocabulary intentionally small so trace filtering remains usable.
    tag_taxonomy:
      entry_points: ["api:chat", "api:chat-stream", "eval:driver", "eval:spike"]

agent:
  # Default provider for every profile. A profile may override it with its own
  # `provider:` key, which is how one profile moves arms while the other stays put.
  # Change `provider` and `model` together - a model name belongs to one provider.
  # Native knobs below are read only by their own provider's branch:
  #   groq     -> reasoning_format, reasoning_effort
  #   deepseek -> thinking (disabled | enabled; enabled means the provider default, on)
  # Serving moved to deepseek on measured throughput (D-045). The groq knobs stay so the
  # other arm is one edit away: set both profiles back to `groq` / `qwen/qwen3.6-27b` and
  # restore `eval.driver.turn_pacing_seconds: 75`.
  provider: deepseek

  react:
    provider: deepseek
    model: deepseek-v4-flash
    temperature: 0.2
    max_tokens: 2048
    timeout: 30
    max_retries: 2
    streaming: true
    stream_usage: true
    reasoning_format: hidden
    reasoning_effort: null
    thinking: disabled  # deepseek ignores temperature while thinking is on (T0027.1)

  sql_generation:
    provider: deepseek
    model: deepseek-v4-flash
    temperature: 0.0
    max_tokens: 1024
    timeout: 30
    max_retries: 2
    streaming: false
    stream_usage: false
    reasoning_format: hidden
    reasoning_effort: none
    thinking: disabled  # this profile's determinism depends on temperature: 0.0

  memory:
    max_turns: 6
  query:
    max_rows: 20
    max_detail_ids: 3
    obligations:
      enabled: true
      zero_results: true
      created_on: true
      free_text: true
      cross_currency: true
      negotiable_salary: true
      listing_expiry: true

eval:
  judge:
    provider: google        # was: groq
    model: gemini-2.5-flash  # was: openai/gpt-oss-120b
    temperature: 0.0
    rpm: 8                  # throttle below Gemini free-tier's ~10 RPM cap (bump to ~25 if provider reverts to groq)
    thinking_budget: 0      # gemini-2.5-flash: 0 disables thinking (kills ~90% of judge output cost); ignored by the groq branch
  fixture:
    database_url: postgresql+psycopg://internhunter:internhunter@localhost:5433/internhunter_eval
  driver:
    # Seconds to wait between turns. This exists only to survive a per-minute token
    # ceiling: one agent turn asks for ~9.2k tokens (inputs plus each call's max_tokens
    # reserve) across its routing, SQL, and synthesis calls, and Groq's free tier admits
    # 8000 TPM, so a turn only lands from an idle window and retrying inside a filled one
    # can never recover. DeepSeek publishes no TPM or TPD limit, only account concurrency,
    # and the driver runs one turn at a time - so the serving default needs no pacing.
    # Restore 75 together with the groq arm; the T0027.3 capture ran 77 turns at 0.
    turn_pacing_seconds: 0
  # Serving prices in USD per million tokens, read only by the trace viewer's cost
  # dashboard. They are estimates - verify against the provider price page before
  # quoting any number outside this repository.
  pricing_usd_per_mtok:
    deepseek-v4-flash: { input: 0.28, output: 0.42 }
    qwen/qwen3.6-27b: { input: 0.59, output: 0.79 }
