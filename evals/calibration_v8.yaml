    answer: 'Tôi tìm các tin có từ ''trưởng'' xuất hiện trong tiêu đề. Lưu ý đây chỉ
      là đối chiếu theo văn bản tiêu đề, không phản ánh chắc chắn cấp bậc quản lý thực
      tế. Các tin gồm: Trưởng nhóm Data – SSI (Hà Nội); Trưởng bộ phận Analytics –
      Tiki (TP.HCM).'
