[project]
name = "internhunteragent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "langchain>=1.3.1",
    "langchain-groq>=1.1.2",
    "langfuse>=4.6.1",
    "pydantic-settings>=2.14.1",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "structlog>=25.5.0",
    "uvicorn>=0.48.0",
    "cloudscraper>=1.2.71",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
]

[tool.ruff]
# Throwaway scraping spikes are excluded from lint (see research/ plan notes).
extend-exclude = ["scripts"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
files = ["src"]
