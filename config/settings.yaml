api:
  docs_enabled: true
  rate_limit: "15/minute"
  max_query_chars: 2000
  stream_heartbeat_seconds: 15  # SSE comment cadence; keep below normal proxy idle windows.
  demo:
    # Static last resort for /api/v1/ready, returned only when the
    # MAX(last_seen_at) query over clean_jobs returns NULL or raises.
    # Not a claim about the corpus: documentation and UI read the measured
    # value from the endpoint. Do not advance this string to look current -
    # a fallback that is never surfaced would only become a second stale
    # date, invalidated by the next ingest run.
    data_snapshot_date: "2026-08-27"
  cors:
    allowed_origins: []  # Set deployed/demo UI origin(s) here later; keep empty for same-origin or no-browser use.
    allow_credentials: false
    allowed_methods: ["GET", "POST", "OPTIONS"]
    allowed_headers: ["*"]

observability:
  langfuse:
    # Environments partition whole processes. The evaluation driver binds its
    # own environment before importing the agent runtime.
    environments:
      default: local
      allowed: [local, production, evaluation]
    # These are the only dimensions allowed to become Langfuse tags. Keep this
    # vocabulary intentionally small so trace filtering remains usable.
    tag_taxonomy:
      entry_points: ["api:chat", "api:chat-stream", "eval:driver", "eval:spike"]

agent:
  # The governed v0 bundle. This one switch moves the system prompt and the tool
  # registration together, so a new prompt can never run against the old tools.
  # The rollback is this key set back to false, which restores the v1 prompt and
  # the v1 tool pair. See docs/refactor/agent-v0-cutover.md.
  agent_v0: true

  # Named deployments are the serving allowlist. Model names must use LiteLLM's
  # provider-qualified form, and each profile selects only one deployment.
  # `api_key_env` names a deployment environment variable. It never contains a secret.
  providers:
    deepseek_flash:
      provider: deepseek
      model: deepseek/deepseek-v4-flash
      api_key_env: DEEPSEEK_API_KEY
    groq_qwen:
      provider: groq
      model: groq/qwen/qwen3.6-27b
      api_key_env: GROQ_API_KEY

  # End-to-end serving deadline for one SSE turn. Invalid or omitted values fall
  # back to 120 seconds so one blocked stream cannot occupy the sole web worker.
  stream_turn_timeout_seconds: 120
  prompts:
    # Fetch one explicit deployment label, never mutable `latest`. The checked-in
    # config/prompts.yaml text is a release-pinned fallback for an unavailable client.
    deployment_label: production
    cache_ttl_seconds: 60

  react:
    deployment: deepseek_flash
    temperature: 0.2
    max_tokens: 2048
    timeout: 30
    max_retries: 2
    streaming: true
    provider_options:
      # DeepSeek ignores temperature when thinking is enabled (T0027.1).
      thinking: disabled

  sql_generation:
    deployment: deepseek_flash
    temperature: 0.0
    max_tokens: 1024
    timeout: 30
    max_retries: 2
    streaming: false
    provider_options:
      # This profile's determinism depends on temperature: 0.0.
      thinking: disabled

  memory:
    max_turns: 6
    compaction:
      trigger_messages: 48
      keep_messages: 12
  query:
    max_rows: 20
    max_detail_ids: 3
    # Governed query core, shared by search and analytics. The limits live here
    # rather than in the query package so the display cap above stays the one
    # cap: the core never invents a second number for how many rows may show.
    # The behavior these limits serve is docs/refactor/agent-v0-contract.md.
    max_filters: 4
    max_values_per_filter: 4
    max_group_values: 20
    max_top_n: 20
    max_free_text_terms: 3
    # Every compiled statement runs inside a read-only transaction on the
    # least-privilege agent role, with a server-side statement timeout and a
    # byte budget on the returned rows. Neither replaces the other.
    statement_timeout_ms: 2000
    max_result_bytes: 262144
    # User-side city synonyms that the ingestion alias map does not carry. The
    # canonical city names, the role aliases, and the technology aliases are
    # NOT repeated here: config/ingestion.yaml and config/tech_vocabulary.yaml
    # are the single source for those, so a change to them reaches the query
    # core without a second edit.
    user_city_synonyms:
      saigon: Ho Chi Minh City
      "sai gon": Ho Chi Minh City
      "sài gòn": Ho Chi Minh City
      sg: Ho Chi Minh City
    obligations:
      enabled: true
      zero_results: true
      created_on: true
      free_text: true
      cross_currency: true
      negotiable_salary: true
      listing_expiry: true

eval:
  judge:
    provider: google       # Google AI Studio (Gemini API); was openrouter (ox-alpha), before that groq
    model: gemma-4-31b-it  # served by AI Studio directly; OpenRouter fallback stays available in build_judge()
    temperature: 0.0
    timeout_seconds: 120   # client socket timeout; default 30 was too tight for gemma CoT prompts that take 50-90s to score (measured on #266 retries of hlp-referent/hlp-senior-title/hlp-abstraction FAIL cases)
  fixture:
    database_url: postgresql+psycopg://internhunter:internhunter@localhost:5433/internhunter_eval
  capture:
    max_attempts: 3
    consecutive_quota_failures_before_halt: 3
