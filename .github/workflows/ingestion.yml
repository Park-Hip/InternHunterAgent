name: Nightly ingestion

on:
  # SCHEDULE REMOVED 2026-09-18 under the frozen-data portfolio release (#405,
  # ADR-0053). The VietnamWorks robots/terms gate failed closed as of the
  # 2026-08-28 run, and every scheduled attempt since then failed before
  # fetching or writing (#403). The deployed demo now serves a historical
  # snapshot (last measured 2026-08-27). An armed schedule would only keep
  # producing known failures, so it is removed. `workflow_dispatch` stays for
  # an approved future recovery.
  #
  # Do not silently re-arm `schedule:` here. Restoring ingestion follows the
  # cron activation runbook and requires a provider-authorized path proven by
  # one manual and one scheduled run, then the frozen-data notice and affected
  # docs are reverted together (see the #405 rollback path).
  #
  # History that stays true: GitHub fires `schedule:` from the default branch
  # AUTOMATICALLY, so re-adding the trigger to `main` IS the activation, not a
  # precondition for it. PR #29 (`bcc81db`, 2026-07-22) proved this by arming
  # the cron before several activation gates were signed, and all 19 runs
  # through 2026-08-09 failed at config load (`DATABASE_URL` secret unset).
  # The rule that survived is unchanged for any future recovery: prove a run
  # works by `workflow_dispatch` BEFORE re-arming a schedule, never the
  # reverse.
  workflow_dispatch: {}

concurrency:
  group: ingestion
  # A run already mid-write must finish rather than be killed partway —
  # partial writes are the risk this guards against. A queued duplicate
  # waits for it instead of running alongside it.
  cancel-in-progress: false

# Least privilege: this workflow only reads the repo and calls the
# ingestion CLI as an external process, so no elevated scope is needed.
# `contents: write` is deliberately NOT granted here — see the keepalive
# note below for why that step is not wired in.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Expected runtime is well under 10 minutes; this is a ceiling that
    # kills a hung run rather than letting it burn Actions minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.8.15"

      # Mirrors docker/Dockerfile: --frozen matches the lockfile exactly,
      # --no-dev skips the dev dependency group since ingestion imports
      # nothing from it.
      - run: uv sync --frozen --no-dev

      # No migrations run from this workflow. Schema changes go through a
      # deliberate `alembic upgrade head` run by the maintainer (T0019.2's
      # decision) — an unattended job must never migrate a production
      # database.
      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
          # AGENT_DATABASE_URL, GROQ_API_KEY, and Langfuse keys are not read by
          # any ingestion code path. src/core/config.py's Settings model declares
          # them required-no-default and validates at import, so the CLI cannot
          # start without them (verified: check B). These are placeholders to
          # satisfy validation — never real credentials, because ingestion is
          # deterministic and calls no LLM.
          AGENT_DATABASE_URL: "unused-by-ingestion"
          GROQ_API_KEY: "unused-by-ingestion"
          LANGFUSE_SECRET_KEY: "unused-by-ingestion"
          LANGFUSE_PUBLIC_KEY: "unused-by-ingestion"
        run: uv run python -m src.services.ingestion.loader

      # Keepalive step intentionally omitted, not just left uncommented-out
      # as a stub. gautamkrishnar/keepalive-workflow — the action the
      # ticket named — has been disabled by GitHub Staff for violating
      # GitHub's Terms of Service (the repo returns HTTP 403 "Repository
      # access blocked: tos" as of this writing). Reporting on it: the
      # action was designed to circumvent GitHub's 60-day inactivity
      # auto-disable policy, which is itself the ToS violation GitHub
      # cited. No commit SHA can be verified because the repository is
      # inaccessible, and pinning a defunct, ToS-violating action would be
      # worse than leaving the gap. The 60-day auto-disable risk this was
      # meant to cover is logged in docs/Known_Issues.md instead, for a
      # maintainer to address deliberately (e.g. a manual monthly no-op
      # commit, or a from-scratch workflow that only touches this repo).
      # TODO(maintainer): decide how to cover the 60-day inactivity risk.
