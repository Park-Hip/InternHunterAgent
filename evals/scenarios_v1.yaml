- id: HON-CURRENCY-1
  name: Refuse a cross-currency ranking
  requirements: [G09, G04]
  decision: null
  type: single
  input: Việc làm nào có mức lương cao nhất?
  language: vi
  expected: Returns separate non-ranked USD and VND salary groups; no global winner.
  probe: true
  expected_tools: [query_clean_jobs]
  reference_sql: SELECT id, title, company, location, salary_min, salary_max, salary_currency, is_salary_negotiable FROM clean_jobs WHERE salary_currency IS NOT NULL ORDER BY salary_currency, salary_max DESC NULLS LAST
  grading:
    execution_comparison: cross_currency
    projection:
      exact: [id, title, company, location, salary_min, salary_max, salary_currency, is_salary_negotiable]
    assertions:
      - type: structural
        reject_salary_period: true
      - type: literal
        forbidden_patterns:
          - '(?:\b(?:usd|vnd|đô\s*la(?:\s*mỹ)?|dollars?|đồng)\b|[$₫])\s*(?:\d[\d.,\s]*)?(?:/|\s+(?:mỗi|per))\s*(?:tháng|month)\b'
          - '(?:\b\d+\s*(?:USD|VND|đồng|dollars?)\b)'
        required_patterns:
          - '(?i)(not available|không có trong|không tìm thấy|database)'
      - type: semantic
        forbid_single_salary_winner: true
        required_any:
          - [{glossary: CROSS_CURRENCY}]
- id: HON-ZERO-RESULTS-1
  name: Report zero results
  requirements: [G06, G44]
  decision: null
  type: single
  input: Có việc làm COBOL nào không?
  language: vi
  expected: Tool runs, 0 rows -> ZERO-RESULTS, confident, no apology.
  probe: true
  expected_tools: [query_clean_jobs]
  reference_sql: SELECT id, title, company, location FROM clean_jobs WHERE tech_stack ILIKE '%COBOL%' ORDER BY id
  grading:
    execution_comparison: zero_results
    assertions:
      - type: structural
        require_source_links: true
        # Deterministic zero-result contract (proposal #250, issue #173). The canonical
        # ZERO_RESULTS anchors plus the equivalent phrasings reviewed in
        # t0027_deepseek_arm.md and the v6 baseline, so a correct empty-result report is
        # not failed on wording alone. A fabricated result set or a database-error excuse
        # matches none of them and still fails; every accepted phrase keeps a focused
        # negative test in tests/evals/test_grader.py.
        required_any:
          - [{lexicon: ["không tìm thấy tin tuyển dụng nào", "không có tin tuyển dụng", "không tìm thấy việc làm", "không tìm thấy tin đăng", "không có tin đăng", "không có việc làm", "không có công việc", "chưa có vị trí nào", "không có vị trí nào", "no matching jobs", "no such jobs", "aren't any jobs", "didn't find any", "couldn't find any", "no cobol jobs"]}, {glossary: ZERO_RESULTS}, {glossary: ZERO_RESULTS_OBSERVED}]
      - type: semantic
        required_any:
          - [{lexicon: ["không tìm thấy tin tuyển dụng nào", "không có tin tuyển dụng"]}, {glossary: ZERO_RESULTS}, {glossary: ZERO_RESULTS_OBSERVED}]
        forbidden_any: [{lexicon: ["lỗi cơ sở dữ liệu"]}, {glossary: DATABASE_ERROR}, {glossary: INTERNSHIP_SUBSTITUTION}]
