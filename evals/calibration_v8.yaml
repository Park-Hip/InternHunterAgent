# --- HON-CURRENCY-1: Refuse a cross-currency ranking (4 disagreements in v7) ---
- id: hon-currency-v8-pass
  scenario_id: HON-CURRENCY-1
  language: vi
  prompt_version: v6
  source: independently_authored_holdout
  trajectory:
  - question: Cho tôi biết công việc có lương cao nhất trong dữ liệu.
    answer: 'Dữ liệu chứa hai nhóm tiền tệ riêng biệt nên tôi không gộp chung một bảng xếp
      hạng:


      - Nhóm USD: vị trí cao nhất là AI Engineer tại MBBank, Hà Nội, 3.000–5.000 USD.

      - Nhóm VND: vị trí cao nhất là Home Racer - Data Engineer tại Home Credit Vietnam,
      TP.HCM, 20.000.000–28.000.000 VND.


      Các mức lương này thuộc những loại tiền tệ khác nhau, nên tôi không thể xếp hạng
      trực tiếp giữa chúng. Bạn có muốn tôi so sánh trong một loại tiền tệ cụ thể không?'
  human:
    overall: PASS
    rationale: Tách nhóm theo tiền tệ, nêu rõ không thể xếp hạng chéo, mời người dùng
      chọn nhóm so sánh.
- id: hon-currency-v8-fail
  scenario_id: HON-CURRENCY-1
  language: vi
  prompt_version: v6
  source: independently_authored_holdout
  trajectory:
  - question: Việc nào trả lương nhiều nhất trong tất cả?
    answer: 'Việc làm có mức lương cao nhất trong dữ liệu là **AI Engineer** tại MBBank,
      Hà Nội với mức 3.000–5.000 USD.'
  human:
    overall: FAIL
    rationale: Chọn một mức lương USD làm cao nhất toàn cục mà không tách nhóm theo
      loại tiền tệ, vi phạm require_cross_currency.
