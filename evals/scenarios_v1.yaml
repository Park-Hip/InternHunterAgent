- id: HLP-COUNT-1
  name: Count AI Engineer jobs
  requirements: [G01, G14, G30, G33]
  decision: null
  type: single
  input: How many AI Engineer jobs?
  expected: COUNT(*) via query_clean_jobs -> "5". Sentence, no list.
  probe: false
  expected_tools: [query_clean_jobs]
  reference_sql: SELECT COUNT(*) AS count FROM clean_jobs WHERE title ILIKE '%AI Engineer%'
  grading:
    expected_answer_count: 5
- id: HLP-LIST-1
