[project]
name = "internhunteragent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.136.3",
    "langchain>=1.3.1,<1.4.0",
    "langchain-groq>=1.1.2,<1.2.0",
    "langchain-google-genai>=4.3.5,<4.4.0",
    "langchain-openai>=1.5.0,<1.6.0",
    "langfuse>=4.6.1",
    "pydantic-settings>=2.14.1",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "langgraph-checkpoint-postgres>=3.1.0,<3.2.0",
    "structlog>=25.5.0",
    "uvicorn>=0.48.0",
    "cloudscraper>=1.2.71",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "httpx>=0.27",
    "slowapi>=0.1.10",
    "langchain-deepseek>=1.1.0,<1.2.0",
]

[dependency-groups]
dev = [
    "deepeval>=4.0.7",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
]

[tool.ruff]
# Throwaway scraping spikes are excluded from lint (see research/ plan notes).
# Ruff ignores negated exclude patterns, so the spikes are listed one by one and
# every other script in scripts/ (register_langfuse_prompts.py) stays linted.
extend-exclude = [
    "scripts/audit_fields.py",
    "scripts/build_tech_vocabulary.py",
    "scripts/deepseek_provider_spike.py",
    "scripts/docs_build.py",
    "scripts/docs_lint.py",
    "scripts/scrape_itviec_spike.py",
    "scripts/scrape_spike.py",
    "scripts/scrape_topcv_spike.py",
    "scripts/scrape_topdev_spike.py",
    "scripts/sync_agent_instructions.py",
    "scripts/vietnamese_prompt_spike.py",
]

[tool.ruff.lint.per-file-ignores]
# The src.* imports must follow the sys.path bootstrap so the script runs standalone.
"scripts/register_langfuse_prompts.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
files = ["src", "scripts/register_langfuse_prompts.py"]

[tool.pytest.ini_options]
markers = [
    "eval: live-API eval tests (Groq/Gemini). Excluded from the default run; select with -m eval or run via `deepeval test run`.",
]
addopts = "-m 'not eval' --strict-markers"
