    note: >-
      Allocated 2026-08-17 out of M33 by decision D2 of the T0032.4 spike triage
      (.lavish/vietnamese-m33.html): the multi-turn instability the spike observed is a
      serving-path defect that predates any Vietnamese work, and it must not ship reviewed as a
      Vietnamese feature. Mechanism, measured against the real TrimMessagesMiddleware over nine
      turns: agent.memory.max_messages 20 with trim_messages(strategy="last", token_counter=len)
      holds exactly five turns when each turn calls one tool (4 messages per turn), so turn 6 is
      the first eviction, and a turn calling both query_clean_jobs and get_job_details costs six
      messages and drops the window to three turns - the pattern the demo invites. The system
      prompt survives trimming at every depth. What the spike saw "after turn six" is that
      boundary, not multilingual decay: at MT-6 the referent chain rooted in MT-1 lost its
      antecedent and two of three runs called get_current_time. Tickets: .1 reproduces the
      eviction in English first, against the recording model, and re-files
