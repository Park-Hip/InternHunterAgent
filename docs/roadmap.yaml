  - id: M37
    title: Ingestion Failure Bounding
    status: complete
    tickets: [T0037.1]
    scope:
      - src/services/ingestion/sources/vietnamworks.py
      - config/ingestion.yaml
      - tests/services/ingestion/test_vietnamworks.py
      - .github/workflows/ingestion.yml
      - docs/roadmap.yaml
      - docs/entries/
    note: >-
      Allocated 2026-08-18 against a gap the 2026-08-18 nightly exposed: a total-source outage
      cannot fail cleanly, because the run needs longer to give up than the job is allowed to live.
      Mechanism, measured against run 32093739835: every VietnamWorks request hung for its full
      timeout rather than being refused, so each page cost retry_attempts 2 plus the initial try at
      timeout_seconds 30, plus retry_backoff_seconds 2.0 doubling once - 3 x 30 + 2 + 4 = 96s, which
      is exactly the observed spacing between consecutive ingestion.page_failed events. At 8 queries
      x pages_per_query 2 = 16 requests, a whole-source failure runs about 26 minutes against
      timeout-minutes 15, so the runner cancels the job instead of letting it exit. main()'s
      except IngestionSafetyError never fires, logger.error("ingestion.aborted") never logs, and the
      only diagnostic is raw log timestamps. A whole-source failure is the exact case that abort
      path was written for and the one case it structurally cannot reach. No data was at risk -
      fetch() must return before upsert_raw_postings runs, and the kill landed mid-fetch on query 9
      of 16 - and the dead-man ping behaved correctly by staying silent. The outage itself was
      transient, not a standing block: a workflow_dispatch re-run the same morning (32109357817)
      returned pages_failed 0 and fetched 100 from the same runner infrastructure, and the API
      answered a hand-probe in 0.36s throughout, so nothing here is a fix for the source going dark.
      T0037.1 bounds the run with a global elapsed-time budget checked before every request, so
      fetch() always returns and main() always reaches its abort path. The budget was chosen over a
      consecutive-failure circuit breaker because only the budget holds the invariant under
      intermittent failure and under a larger query count; the breaker bounds the all-failing case
      alone. Raising timeout-minutes was rejected outright: it moves the ceiling without bounding
      the run. .github/workflows/ingestion.yml is in scope so the budget can be reconciled against
      the ceiling in one PR, not because the ceiling is expected to change. docs/roadmap.yaml is in
      scope for this milestone's own status line, which intersects M24 on that file alone - the
      same append-only overlap M36 carried, not a shared code path. Scope is otherwise disjoint from
      M23, M24, M33, M34 and M35, which touch no ingestion path.
      Complete 2026-08-18 (T0037.1, PR #71): api.max_elapsed_seconds 600 is checked before every
      request in both _collect loops, so _collect stops issuing, fetch() returns with whatever it
      has, and assert_min_yield aborts the run with a logged reason - which is the pre-existing and
      correct behaviour for an empty fetch. Verified against a real non-routable blackhole with no
      mocks: fetch() returned in 21.8s against an unbounded worst case of 336s. The declared
      .github/workflows/ingestion.yml was deliberately not changed; timeout-minutes stays 15 and the
      budget was sized under it (600s plus one page's ~96s worst case is about 11.6 minutes), which
      is the reconciliation that path was declared for. The two are linked by a comment rather than
      a check, filed as KI-2026-08-18-budget-ceiling-unlinked. Left open by choice: a
      consecutive-failure breaker on top of the budget, and surfacing budget_exhausted in the
      run_ingestion result dict, which needs loader.py and so needs a scope this milestone does not
      hold.

