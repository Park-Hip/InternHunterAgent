# Resumi MVP baseline dev corpus (#708): the 36 original questions.
# Generated by a separate AI from the #708 brief, then reviewed against the ingestion
# vocabulary (config/ingestion.yaml role_taxonomy and city_alias_map).
#
# All 36 are dev. The 12 cases that were once held-out were used while tuning
# sql_generation, so they can no longer measure generalization; they stay here as
# regression cases. Held-out questions live in held_out.yaml, paraphrases in
# paraphrases.yaml, and the safety smoke set in safety.yaml (#761).
# answerable is a quoted enum: "yes", "no", or "partial".
#
# reference_sql runs against a local snapshot of production clean_jobs taken 2026-10-18
# (database internhunter_snapshot_20261018, 367 rows). Every statement executes; the result
# sizes are recorded in the #708 thread. Scope (#708, option b): AI/Data jobs for students
# and freshers, internships when they exist.
#
# Conventions:
# - reference_sql has one entry per turn. null means the turn is not scored by SQL.
# - compare: ids (the set of matching row ids, no ORDER BY or LIMIT unless the question
#   asks for a top row), count (one COUNT(*) AS count value), rows (every returned row).
# - Roles and cities use the canonical stored values: role is one of AI Engineer,
#   Data Scientist, Data Engineer, Data Analyst, ML Engineer, Software Developer, Other;
#   cities are Hanoi, Ho Chi Minh City, Da Nang, Can Tho, Hai Phong, Other.
# - "AI jobs" means the AI Engineer role, and "Machine Learning jobs" the ML Engineer role
#   (maintainer decisions, #708).
# - review: an open question to settle before the set is frozen. note: context for a grader.

- id: "001"
  split: dev
  need: find
  turns:
    - "Mình muốn tìm internship AI Engineer, có những tin nào vậy?"
  style: mixed
  answerable: "yes"
  expected: "Lọc is_internship = TRUE và role AI Engineer, trả về các tin phù hợp cùng công ty, địa điểm và link gốc; không suy ra vai trò AI chỉ từ title hoặc tech_stack."
  note: "Internships when they exist: the snapshot holds one AI Engineer internship."
  compare: ids
  reference_sql:
    - SELECT id FROM clean_jobs WHERE is_internship = TRUE AND role ILIKE '%AI Engineer%'

