  FREE_TEXT_HEDGE: ["dedicated field", "posting text", "may be imperfect"]
  SENIOR_TITLE_HEDGE: ["title wording", "structured seniority level", "title alone"]
  CROSS_CURRENCY: ["different currencies", "can't rank them", "one currency"]
  TRUNCATION: ["more matches", "first 20", "try narrowing"]
  ZERO_RESULTS: ["didn't find any postings"]
  E1_CLARIFY: ["any particular role", "tech, or location"]
  OFF_TOPIC_REDIRECT: ["outside what I can help with", "job postings in our data"]
  DESTRUCTIVE_REFUSAL: ["can't change", "add, or delete any data"]
