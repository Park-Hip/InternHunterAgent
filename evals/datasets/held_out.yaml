# Fresh held-out questions for the Resumi baseline (#761, #617 row 7 D6).
#
# Written from the same product brief as the #708 dev corpus, but after that
# corpus was frozen and without reading the dev cases' generated SQL, so the
# answers here are not tuned against. The reference statements follow the
# snapshot's documented schema and the per-question result sizes the 2026-10-19
# run recorded; tests/evals/test_baseline_dataset.py executes every one on the
# 24-row fixture, and scoring executes them against the frozen production
# snapshot named in baseline_manifest.yaml.
#
# Rules for this file:
# - Every case is held-out. It is measured at a milestone, not while tuning a
#   prompt, a tool, or the query path. See docs/how-to/evaluate.md.
# - answerable is a quoted enum: "yes", "no", or "partial".
# - reference_sql has one entry per turn; null means the turn is scored by a
#   detail call instead of SQL.
# - compare: ids (matching row ids), count (one COUNT(*) AS count value), or
#   rows (every returned row, order-insensitive, including column names).
# - Refused statements carry an expect block instead of reference SQL. The
#   agent run scores refusal and forbids the named values appearing in the
#   answer (#745).
#
# The cases named in #745 are here: the two split breakdowns (H24, H25), the
# four-turn paging conversation (H26), and the three refused statements
# (H27-H29).

