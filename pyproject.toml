[project]
name = "internhunteragent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "langchain>=1.3.1",
    "langchain-groq>=1.1.2",
    "langfuse>=4.6.1",
    "pydantic-settings>=2.14.1",
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "structlog>=25.5.0",
    "uvicorn>=0.48.0",
    "cloudscraper>=1.2.71",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    # Scraping spike (scripts/scrape_spike.py) — kept in dev so the production API
    # image (built with `uv sync --no-dev`) stays lean. Promote to main deps if/when
    # ingestion graduates to a real adapter. The spike hits VietnamWorks' JSON search
    # API, so only an HTTP client is needed (no HTML parser).
    "httpx>=0.27",
]
